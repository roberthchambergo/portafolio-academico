<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Unidad | Base de Datos II</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #080808;
            color: white;
            min-height: 100vh;
        }


        header {
            background: #111;
            padding: 20px 8%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #333;
        }


        header h1 {
            font-size: 24px;
        }


        .volver {
            text-decoration: none;
            color: white;

            background: #b74b4b;

            padding: 10px 18px;

            border-radius: 8px;

            transition: 0.3s;
        }


        .volver:hover {
            background: #933b3b;
        }


        .contenedor {
            width: 90%;
            max-width: 1100px;

            margin: 50px auto;

            text-align: center;
        }


        .contenedor h2 {
            font-size: 35px;

            margin-bottom: 15px;
        }


        .contenedor h2 span {
            color: #b74b4b;
        }


        .contenedor > p {
            color: #bbb;

            margin-bottom: 40px;
        }


        .semanas {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;
        }


        .semana {
            background: #151515;

            border: 1px solid #333;

            border-radius: 15px;

            padding: 40px 20px;

            cursor: pointer;

            transition: 0.3s;
        }


        .semana:hover {
            transform: translateY(-7px);

            border-color: #b74b4b;

            box-shadow:
                0 0 20px
                rgba(183, 75, 75, 0.25);
        }


        .semana i {
            font-size: 45px;

            color: #b74b4b;

            margin-bottom: 20px;
        }


        .semana h3 {
            font-size: 22px;

            margin-bottom: 10px;
        }


        .semana p {
            margin: 0;

            color: #aaa;
        }


        @media (max-width: 700px) {

            .semanas {
                grid-template-columns: 1fr;
            }


            header {
                flex-direction: column;

                gap: 15px;
            }

        }

    </style>


    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<header>

    <h1>
        Base de Datos II
    </h1>


    <a href="base-datos-ii.html"
        class="volver">

        <i class="fa-solid fa-arrow-left"></i>

        Volver

    </a>

</header>



<main class="contenedor">


    <h2>
        Unidad
        <span id="numeroUnidad"></span>
    </h2>


    <p>
        Selecciona una semana para ver sus materiales.
    </p>



    <div class="semanas">


        <!-- SEMANA 1 -->

        <div class="semana"
            onclick="abrirSemana(1)">

            <i class="fa-solid fa-folder-open"></i>

            <h3>
                Semana 1
            </h3>

            <p>
                Materiales de la semana 1
            </p>

        </div>



        <!-- SEMANA 2 -->

        <div class="semana"
            onclick="abrirSemana(2)">

            <i class="fa-solid fa-folder-open"></i>

            <h3>
                Semana 2
            </h3>

            <p>
                Materiales de la semana 2
            </p>

        </div>



        <!-- SEMANA 3 -->

        <div class="semana"
            onclick="abrirSemana(3)">

            <i class="fa-solid fa-folder-open"></i>

            <h3>
                Semana 3
            </h3>

            <p>
                Materiales de la semana 3
            </p>

        </div>



        <!-- SEMANA 4 -->

        <div class="semana"
            onclick="abrirSemana(4)">

            <i class="fa-solid fa-folder-open"></i>

            <h3>
                Semana 4
            </h3>

            <p>
                Materiales de la semana 4
            </p>

        </div>


    </div>


</main>



<script>


    // Obtener la unidad desde la URL

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const unidad =
        parametros.get("unidad");



    // Si no existe unidad,
    // volver al curso

    if (!unidad) {

        window.location.href =
            "base-datos-ii.html";

    }



    // Mostrar número de unidad

    document.getElementById(
        "numeroUnidad"
    ).textContent = unidad;



    // Abrir semana correspondiente

    function abrirSemana(numeroSemana) {

        window.location.href =
            "semana-base-datos.html?unidad="
            + unidad
            + "&semana="
            + numeroSemana;

    }


</script>


</body>

</html>
